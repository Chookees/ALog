# Weekly grouped updates. The SQL image digest is not a package Dependabot can see.
version: 2
updates:
  # Libraries stay on Microsoft.Extensions 10.0.x. Tests and smoke keep majors.
  - package-ecosystem: nuget
    directories:
      - "/ALog"
      - "/ALog.Extensions.Logging"
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      aws:
        patterns:
          - "AWSSDK.*"
      sql:
        patterns:
          - "Microsoft.Data.SqlClient"
          - "System.Security.Cryptography.Pkcs"
      test:
        patterns:
          - "Microsoft.CodeAnalysis.*"
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: nuget
    directories:
      - "/ALog.Tests"
      - "/ALog.Benchmarks"
      - "/eng/c4-hang-probe"
      - "/eng/exf-toplevel"
      - "/eng/consumer-smoke/console"
      - "/DemoApp/Quickstart"
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      aws:
        patterns:
          - "AWSSDK.*"
      sql:
        patterns:
          - "Microsoft.Data.SqlClient"
          - "System.Security.Cryptography.Pkcs"
      test:
        patterns:
          - "xunit*"
          - "coverlet*"
          - "Microsoft.NET.Test.Sdk"
          - "Testcontainers*"
          - "Microsoft.CodeAnalysis.*"
          - "SSH.NET"
    ignore:
      # bis v3/MTP
      - dependency-name: "coverlet.*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # bleibt auf .NET 10, kein SDK-Major-Sprung
      - dependency-name: "dotnet-sdk"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: pip
    directory: "/eng"
    schedule:
      interval: weekly
