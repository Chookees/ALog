# Comparison harness, five sequential runs (BEN-07). Not a required check.
# workflow_dispatch only. It does not run on push or pull requests.
# Required jobs stay in dotnet.yml. bench-smoke there is also not required.

name: Comparison bench

on:
  workflow_dispatch:

concurrency:
  group: comparison-bench
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Assert SDK version
      run: |
        version=$(dotnet --version)
        echo "dotnet --version ${version}"
        test "$version" = "10.0.402"

    - name: Five sequential runs
      working-directory: bench/ALog.Comparison
      run: ./run.sh 5

    - name: Upload results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: comparison-bench-results
        path: bench/ALog.Comparison/results
        retention-days: 7
        if-no-files-found: error
