# Library CI for ALog (.NET 10)
# SQL Server is started in a step so the password can be generated and masked.
# The image pin is the single digest in ALOG_SQL_IMAGE.

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The coverage gate reads the pull-request body. Contents stay read.
    # Uploading an artifact in this run does not need an actions permission.
    permissions:
      contents: read
      pull-requests: read
    env:
      COVERAGE_ENFORCE: "true"
      # Only the value 1 enables the SQL live tests. true (any case) does too.
      # Any other non-empty value fails the SQL tests. Empty or unset skips them.
      ALOG_REQUIRE_SQL: "1"
      ALOG_SQL_IMAGE: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Assert SDK version
      run: |
        version=$(dotnet --version)
        echo "dotnet --version ${version}"
        test "$version" = "10.0.403"

    - name: Show .NET info
      run: dotnet --info

    - name: Install CI Python tools
      run: |
        python3 -m venv "$RUNNER_TEMP/ci-venv"
        echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
        export PATH="$RUNNER_TEMP/ci-venv/bin:$PATH"
        python3 -m pip install --require-hashes --only-binary=:all: -r eng/requirements-ci.txt

    - name: Script tests
      run: |
        bash eng/test_vuln_check.sh
        bash eng/test_start_sql.sh
        bash eng/test_consumer_smoke.sh
        bash eng/test_s4_grep.sh
        python3 eng/test_coverage_gate.py
        python3 eng/test_coverage_badge.py
        python3 eng/test_coverage_exception_check.py
        python3 eng/test_analyzer_ratchet_check.py
        bash eng/test_bb_grep.sh
        bash eng/test_clk_grep.sh
        bash eng/test_lock_pid.sh
        bash eng/test_build_base_assemblies.sh
        python3 eng/test_coverage_metadata.py
        python3 eng/test_sync_wait_check.py
        python3 eng/sync-wait-check.py

    - name: Start SQL Server
      run: bash eng/start-sql.sh "$ALOG_SQL_IMAGE"

    - name: Restore
      run: dotnet restore ALog.sln

    - name: Build property proof
      run: bash eng/build-property-proof.sh

    - name: Build
      run: |
        dotnet build ALog/ALog.csproj -c Release --no-restore -p:ErrorLog='"${{ runner.temp }}/ALog.sarif,version=2.1"'
        dotnet build ALog.Extensions.Logging/ALog.Extensions.Logging.csproj -c Release --no-restore -p:ErrorLog='"${{ runner.temp }}/ALog.Extensions.Logging.sarif,version=2.1"'
        dotnet build ALog.sln -c Release --no-restore

    - name: Pack license check
      run: |
        out="${{ runner.temp }}/license-nupkgs"
        mkdir -p "$out"
        dotnet pack ALog/ALog.csproj -c Release --no-restore -o "$out" --nologo
        dotnet pack ALog.Extensions.Logging/ALog.Extensions.Logging.csproj -c Release --no-restore -o "$out" --nologo
        bash eng/test_nupkg_license.sh --dir "$out"
        python3 eng/test_nupkg_native.py --dir "$out"
        mkdir -p "$out/core"
        cp "$out"/ALog.[0-9]*.nupkg "$out/core/"

    - name: Upload packed ALog
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: alog-nupkg
        path: ${{ runner.temp }}/license-nupkgs/core/*.nupkg
        if-no-files-found: error
        retention-days: 1

    - name: RS0030 justification
      run: python3 eng/rs0030-justification-check.py --sarif "${{ runner.temp }}/ALog.sarif" --sarif "${{ runner.temp }}/ALog.Extensions.Logging.sarif"

    - name: Test
      id: test
      run: |
        set +e
        dotnet test ALog.sln -c Release --no-build --verbosity normal --results-directory TestResults --logger trx --collect "XPlat Code Coverage" --settings coverage.runsettings --blame-hang-timeout 5m --blame-hang-dump-type mini > "$RUNNER_TEMP/test-log.txt" 2>&1
        status=$?
        set -e
        cat "$RUNNER_TEMP/test-log.txt"
        if [ "$status" -eq 0 ]; then
          count=$(grep -F -c 'ALOG-SQL-INTEGRATION ran server=' "$RUNNER_TEMP/test-log.txt" || true)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one SQL integration proof line, found ${count}." >&2
            exit 1
          fi
        fi
        exit "$status"

    - name: Fetch base branch
      run: |
        if [ -n "${{ github.base_ref }}" ]; then
          base="${{ github.base_ref }}"
        else
          base="master"
        fi
        git fetch --no-tags --depth=1 origin "$base"
        echo "COVERAGE_BASE_REF=origin/${base}" >> "$GITHUB_ENV"
        if git cat-file -e "origin/${base}:eng/coverage-ratchet.json"; then
          git show "origin/${base}:eng/coverage-ratchet.json" > "$RUNNER_TEMP/coverage-ratchet-baseline.json"
          echo "COVERAGE_BASELINE=$RUNNER_TEMP/coverage-ratchet-baseline.json" >> "$GITHUB_ENV"
        else
          echo "COVERAGE_BASELINE=" >> "$GITHUB_ENV"
        fi

    - name: Analyzer ratchet
      run: python3 eng/analyzer-ratchet-check.py --base "$COVERAGE_BASE_REF"

    - name: Build coverage metadata tool
      run: dotnet build eng/coverage-metadata/CoverageMetadata.csproj -c Release --nologo

    - name: Build base assemblies
      run: bash eng/build-base-assemblies.sh "$COVERAGE_BASE_REF" "$RUNNER_TEMP/base-bin"

    - name: Coverage exception check
      if: github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 eng/coverage-exception-check.py --base "$COVERAGE_BASE_REF" --base-bin "$RUNNER_TEMP/base-bin"

    - name: Coverage gate
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        args=(--cobertura-dir TestResults --ratchet eng/coverage-ratchet.json --summary "$GITHUB_STEP_SUMMARY" --measurement "$RUNNER_TEMP/coverage-lines.json")
        if [ -n "${COVERAGE_BASELINE}" ]; then
          args+=(--baseline "$COVERAGE_BASELINE")
        fi
        python3 eng/coverage-gate.py "${args[@]}"

    - name: Upload coverage lines
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-lines
        path: ${{ runner.temp }}/coverage-lines.json
        retention-days: 1
        if-no-files-found: error

    - name: Upload test results
      if: failure() && steps.test.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: TestResults
        retention-days: 7
        if-no-files-found: error

    - name: RS0030 rerun
      run: python3 eng/test_rs0030_rerun.py

  vuln-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Assert SDK version
      run: |
        version=$(dotnet --version)
        echo "dotnet --version ${version}"
        test "$version" = "10.0.403"

    - name: Restore
      run: dotnet restore ALog.sln

    - name: Vulnerable package check
      env:
        DOTNET_CLI_UI_LANGUAGE: en
      run: bash eng/vuln-check.sh

  smoke-file:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Assert SDK version
      run: |
        version=$(dotnet --version)
        echo "dotnet --version ${version}"
        test "$version" = "10.0.403"

    - name: Consumer smoke file
      run: bash eng/consumer-smoke.sh file

  smoke-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Assert SDK version
      run: |
        version=$(dotnet --version)
        echo "dotnet --version ${version}"
        test "$version" = "10.0.403"

    - name: Consumer smoke console
      run: bash eng/consumer-smoke.sh console

    - name: Consumer smoke quickstart
      run: bash eng/consumer-smoke.sh quickstart

    - name: Upload quickstart smoke artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: quickstart-smoke
        path: ${{ runner.temp }}/quickstart-smoke
        retention-days: 7
        if-no-files-found: error

  # Comparison harness smoke (BEN-09). Not a required check.
  # Release build, then N=1000. The job is green only when run.sh exits 0,
  # which is every cell valid or n/a. No performance gate.
  # After that smoke the lock must be free, a second run must not exit 3,
  # and a Drop full-queue proof must exit non-zero with every ALog async cell invalid.
  # queue_full_mode is read back from the built configuration before the smoke.
  # The harness sets a 30s per-cell hang guard for this N. The job timeout
  # below is the runner backstop, not a measurement bound.
  bench-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Assert SDK version
      run: |
        version=$(dotnet --version)
        echo "dotnet --version ${version}"
        test "$version" = "10.0.403"

    - name: Build comparison harness
      run: dotnet build eng/comparison-bench -c Release --nologo

    - name: Queue mode is read back from the built configuration
      working-directory: eng/comparison-bench
      run: |
        set -euo pipefail
        bin="bin/Release/net10.0/ALog.Comparison.dll"
        mode=$(dotnet "$bin" queue-mode | tail -n 1)
        test "$mode" = "QueueFullMode=Block"
        mode=$(BENCH_MUTANT_FULL_MODE=Drop dotnet "$bin" queue-mode | tail -n 1)
        test "$mode" = "QueueFullMode=Drop"
        echo "queue-mode read-back ok"

    - name: Smoke N=1000
      working-directory: eng/comparison-bench
      run: BENCH_N=1000 ./run.sh 1 ci

    - name: Assert QueueFullMode=Block and a free lock
      working-directory: eng/comparison-bench
      run: |
        set -euo pipefail
        envf=$(find results/_smoke -path '*/ci-*/env.json' -print | sort | tail -n 1)
        test -n "$envf"
        python3 - "$envf" <<'PY'
        import json, sys
        env = json.load(open(sys.argv[1], encoding="utf-8"))
        libs = {row["id"]: row.get("queue_full_mode") for row in env["libraries"]}
        assert libs["alog-async"] == "QueueFullMode=Block", libs
        assert libs["alog-sync"] == "n/a (no queue)", libs
        print("env.json queue_full_mode ok", sys.argv[1])
        PY
        flock -n /tmp/alog-comparison-bench.lock true
        set +e
        BENCH_N=1 BENCH_LIBS=alog-sync BENCH_SCENARIOS=T6 ./run.sh 1 lockcheck
        status=$?
        set -e
        test "$status" -ne 3
        test "$status" -eq 0
        echo "lockcheck exit $status"

    - name: Drop mode makes the run invalid
      working-directory: eng/comparison-bench
      run: |
        set -euo pipefail
        set +e
        BENCH_N=1 BENCH_LIBS=alog-async BENCH_SCENARIOS=T6 BENCH_MUTANT_FULL_MODE=Drop ./run.sh 1 mutant
        status=$?
        set -e
        test "$status" -eq 1
        echo "mutant exit $status"
        details=$(find results/_smoke -path '*/mutant-*/details.jsonl' -print | sort | tail -n 1)
        test -n "$details"
        python3 - "$details" <<'PY'
        import json, sys
        reason = "ALog async requires QueueFullMode=Block for this comparison, but env.json shows Drop. All ALog async cells of this run are invalid."
        lines = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
        assert lines, "no cells"
        for row in lines:
            async_row = row.get("lib") == "alog-async" or (row.get("framework") == "ALog" and row.get("mode") == "async")
            assert async_row, row
            assert row.get("valid") == "false", row
            assert row.get("reason") == reason, row.get("reason")
        print("mutant invalid ok", sys.argv[1], "exit was required non-zero")
        PY

  # Not a required check. Consumes the nupkg packed on ubuntu, then runs the file rotation tests.
  # Copy-and-truncate stays on Linux: a second writer is denied on Windows.
  test-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    # Downloading an artifact from this run does not need an actions permission.
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Assert SDK version
      shell: bash
      run: |
        version=$(dotnet --version)
        echo "dotnet --version ${version}"
        test "$version" = "10.0.403"

    - name: Download ubuntu nupkg
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: alog-nupkg
        path: nupkg

    - name: Package has no native identity and the file sink runs
      shell: bash
      run: |
        if command -v python3 >/dev/null 2>&1; then
          py=python3
        else
          py=python
        fi
        "$py" eng/test_nupkg_native.py --dir nupkg
        bash eng/test_nupkg_consumer.sh nupkg

    - name: File rotation tests
      run: dotnet test ALog.Tests/ALog.Tests.csproj -c Release --nologo --filter FullyQualifiedName~BkpExternalRotationTests

  badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true

    - name: Download coverage lines
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-lines
        path: coverage-lines

    - name: Render coverage badges
      run: python3 eng/coverage-badge.py --measurement coverage-lines/coverage-lines.json --output-dir "$RUNNER_TEMP/coverage-badges"

    - name: Publish coverage badges
      run: python3 eng/publish-coverage-badges.py --svg-dir "$RUNNER_TEMP/coverage-badges"
